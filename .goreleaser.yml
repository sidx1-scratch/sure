version: 2
project_name: sure
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/sidx1/sure/internal/version.Version={{.Version}}
      - -X github.com/sidx1/sure/internal/version.Commit={{.Commit}}
      - -X github.com/sidx1/sure/internal/version.Date={{.Date}}
archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
brews:
  - repository:
      owner: sidx1
      name: homebrew-tap
    homepage: "https://github.com/sidx1/sure"
    description: "Your terminal's second opinion - AI-powered command safety analysis"
    license: "MIT"
    install: |
      bin.install "sure"
    test: |
      system "#{bin}/sure", "--version"
